<!-- Página de Valorant: la presentación vive en el componente común esports-vista -->
<app-esports-vista
  titulo="Valorant"
  descripcion="Habilidades tácticas y puntería letal. El FPS de Riot Games que redefinió el ecosistema competitivo moderno."
  [color]="themeColor"
  [lanzamiento]="stats.lanzamiento"
  [mundial]="stats.mundial"
  [hitos]="historySteps"
  [hitoActual]="currentSlide()"
  [textoHito]="displayText()"
  [partidos]="matches()"
  [cargando]="isLoadingMatches()"
  [leyendas]="legends"
  (anterior)="prevSlide()"
  (siguiente)="nextSlide()"
  (irA)="currentSlide.set($event)"
  (verStream)="redirigirStream($event)" />
