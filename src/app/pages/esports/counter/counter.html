<!-- Página de Counter-Strike 2: la presentación vive en el componente común esports-vista -->
<app-esports-vista
  titulo="Counter-Strike 2"
  descripcion="Táctica, precisión y economía. El shooter competitivo que definió el género durante más de dos décadas."
  [color]="themeColor"
  [lanzamiento]="stats.lanzamiento"
  [mundial]="stats.mundial"
  [hitos]="historySteps"
  [hitoActual]="currentSlide()"
  [textoHito]="displayText()"
  [partidos]="matches()"
  [cargando]="isLoadingMatches()"
  [leyendas]="legends"
  (anterior)="prevSlide()"
  (siguiente)="nextSlide()"
  (irA)="currentSlide.set($event)"
  (verStream)="redirigirStream($event)" />
