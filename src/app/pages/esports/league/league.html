<!-- Página de League of Legends: la presentación vive en el componente común esports-vista -->
<app-esports-vista
  titulo="League of Legends"
  descripcion="Estrategia infinita y dominio del mapa. El MOBA de Riot Games que se convirtió en el fenómeno global más grande de los esports."
  [color]="themeColor"
  [lanzamiento]="stats.lanzamiento"
  [mundial]="stats.mundial"
  [hitos]="historySteps"
  [hitoActual]="currentSlide()"
  [textoHito]="displayText()"
  [partidos]="matches()"
  [cargando]="isLoadingMatches()"
  [leyendas]="legends"
  (anterior)="prevSlide()"
  (siguiente)="nextSlide()"
  (irA)="currentSlide.set($event)"
  (verStream)="redirigirStream($event)" />
