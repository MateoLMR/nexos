<!-- Página de Dota 2: la presentación vive en el componente común esports-vista -->
<app-esports-vista
  titulo="Dota 2"
  descripcion="Estrategia compleja y batallas legendarias. El MOBA de Valve que elevó la profundidad táctica y los premios de los esports a niveles sin precedentes."
  [color]="themeColor"
  [lanzamiento]="stats.lanzamiento"
  [mundial]="stats.mundial"
  [hitos]="historySteps"
  [hitoActual]="currentSlide()"
  [textoHito]="displayText()"
  [partidos]="matches()"
  [cargando]="isLoadingMatches()"
  [leyendas]="legends"
  (anterior)="prevSlide()"
  (siguiente)="nextSlide()"
  (irA)="currentSlide.set($event)"
  (verStream)="redirigirStream($event)" />
