<header class="fixed top-4 inset-x-0 z-50 flex justify-center px-4">
    <nav aria-label="Global"
        class="mx-auto flex w-full max-w-7xl items-center justify-between px-10 py-4
        bg-purple-900/60 backdrop-blur-md border border-fuchsia-500/30 rounded-full shadow-2xl transition-all duration-300">

        <div class="flex flex-1">
            <a routerLink="/" class="flex items-center gap-1 transition-transform hover:scale-105 active:scale-95">
                <span class="sr-only">Nexos</span>
                <img src="Imagenes/Logo.png" alt="Logo Nexos" class="h-12 w-auto object-contain" />
                <p class="text-2xl font-bold text-white tracking-wider">Nexos</p>
            </a>
        </div>

        <div class="flex items-center gap-6 lg:gap-x-10">
            <a routerLink="/"
               routerLinkActive="active-link"
               [routerLinkActiveOptions]="{ exact: true }"
               class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Inicio
                <span class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a routerLink="/juegos"
               routerLinkActive="active-link"
               class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Juegos
                <span class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a routerLink="/comparar"
               routerLinkActive="active-link"
               class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Comparación
                <span class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a routerLink="/esports"
               routerLinkActive="active-link"
               class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Esports
                <span class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a routerLink="/foro"
               routerLinkActive="active-link"
               class="nav-item group relative text-[20px] font-semibold leading-6 text-white transition-all hover:text-fuchsia-300">
                Foro
                <span class="absolute -bottom-1 left-0 h-0.5 w-0 bg-fuchsia-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        </div>
    </nav>

    <style>
        @keyframes nexos-pulse {
            0%   { box-shadow: 0 0 0 0 rgba(212, 126, 252, 0.7); }
            70%  { box-shadow: 0 0 0 15px rgba(212, 126, 252, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 126, 252, 0); }
        }
        .click-pulse { animation: nexos-pulse 0.5s ease-out; }
        .active-link { color: #d47efc !important; }
        .active-underline { width: 100% !important; }
    </style>
</header>
